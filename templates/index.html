<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualización de Datos</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            background-color: #121212; /* Color de fondo oscuro */
            color: #fff; /* Color de texto blanco */
            font-family: Arial, sans-serif; /* Fuente */
            text-align: center; /* Alinear contenido al centro */
        }

        .container {
            max-width: 1200px; /* Ancho máximo del contenedor */
            margin: 20px auto;
            background-color: #1f1f1f; /* Color de fondo del contenedor */
            padding: 20px;
            border-radius: 8px; /* Bordes redondeados */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3); /* Sombra */
            display: grid;
            grid-template-columns: 1fr; /* Una columna para apilamiento vertical */
            grid-gap: 20px; /* Espacio entre los elementos */
        }

        h1 {
            font-size: 32px; /* Tamaño del título principal */
            margin-bottom: 20px; /* Espacio inferior */
            color: #61dafb; /* Color del título principal */
        }

        h2 {
            color: #61dafb; /* Color de encabezados secundarios */
        }

        .grafico {
            width: 100%; /* Hacer que los gráficos ocupen todo el ancho disponible */
            min-height: 400px; /* Altura mínima de los gráficos */
        }

        .titulo-container {
            text-align: center; /* Centrar el título */
            margin-bottom: 20px; /* Espacio inferior */
        }
    </style>
</head>
<body>
    <div class="titulo-container">
        <h1>Activo Fijo Grupo 22</h1>
    </div>
    <div class="logo">
        <!-- Contenedor para la imagen y el título -->
        <div class="logo">
            <img src="https://cdn-icons-png.flaticon.com/512/3490/3490980.png" alt="Logo de Activos Fijos" style="height: 80px;">
            <h1>Business Intelligence</h1>
        </div>

    <div class="container">
        <div>
            <h2>Gráfico de Activos Fijos por Categoría</h2>
            <div id="graficoBarras" class="grafico"></div>
        </div>

        <div>
            <h2>Gráfico de Adquisiciones por Mes</h2>
            <div id="graficoTorta" class="grafico"></div>
        </div>

        <div>
            <h2>Gráfico de Ingresos por Mes</h2>
            <div id="graficoIngresosPorMes" class="grafico"></div>
        </div>

        <div>
            <h2>Total de Ingresos</h2>
            <div id="graficoTotalIngresos" class="grafico" style="background-color: #333;"></div>
        </div>
    </div>

    <script>
        // Obtener los datos del servidor Flask para los primeros tres gráficos
        fetch('/get_all_alquileres')
            .then(response => response.json())
            .then(data => {
                var graficoBarras = JSON.parse(data.grafico_barras);
                var graficoTorta = JSON.parse(data.grafico_torta);
                var graficoIngresosPorMes = JSON.parse(data.grafico_ingresos_por_mes);
                var totalIngresos = data.total_ingresos;
                
                // Mostrar gráfico de barras
                Plotly.newPlot('graficoBarras', graficoBarras.data, {
                    ...graficoBarras.layout,
                    marker: {
                        color: ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf']
                    }
                });

                // Mostrar gráfico de torta
                Plotly.newPlot('graficoTorta', graficoTorta.data, {
                    ...graficoTorta.layout,
                    marker: {
                        colors: ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf']
                    },
                    textinfo: 'percent'
                });

                // Mostrar gráfico de ingresos por mes
                Plotly.newPlot('graficoIngresosPorMes', graficoIngresosPorMes.data, {
                    ...graficoIngresosPorMes.layout,
                    marker: {
                        color: '#1f77b4'
                    }
                });

                // Mostrar gráfico de total de ingresos
                var dataTotalIngresos = [{
                    type: 'indicator',
                    mode: 'number',
                    value: totalIngresos,
                    number: { prefix: '$', valueformat: '.0f' },
                    title: { text: 'Total de Ingresos' }
                }];
                var layoutTotalIngresos = {
                    height: 300,
                    margin: { t: 25, b: 25, l: 25, r: 25 }
                };
                Plotly.newPlot('graficoTotalIngresos', dataTotalIngresos, layoutTotalIngresos);
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
